    <ellipse cx="100" cy="46" rx="4.5" ry="2.5" fill="#FFFFFF"/>
    <ellipse cx="135" cy="55" rx="4" ry="2.5" transform="rotate(20 135 55)" fill="#FFFFFF"/>
    <ellipse cx="85" cy="66" rx="4" ry="2" transform="rotate(10 85 66)" fill="#FFFFFF"/>
    <ellipse cx="120" cy="68" rx="4" ry="2.2" transform="rotate(-15 120 68)" fill="#FFFFFF"/>

