    <path d="M 24 114 L 176 114 C 176 114, 172 136, 160 134 C 152 132, 148 118, 142 118 C 136 118, 134 142, 122 144 C 114 145, 108 122, 102 122 C 96 122, 92 140, 80 142 C 72 143, 68 122, 60 122 C 52 122, 48 136, 38 134 C 30 132, 26 114, 24 114 Z" 
