    <path d="M 52 58 Q 72 63 86 54" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M 148 58 Q 128 63 114 54" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="74" cy="74" rx="14" ry="16" fill="#FFFFFF"/>
    <circle cx="78" cy="74" r="8" fill="#222B2B"/>
    <circle cx="81" cy="71" r="3" fill="#FFFFFF"/>
    
    <ellipse cx="126" cy="74" rx="14" ry="16" fill="#FFFFFF"/>
