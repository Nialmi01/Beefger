  <rect x="126" y="82" width="260" height="22" rx="6" fill="#222B2B"/>
  <text x="256" y="98" font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" letter-spacing="2.5" fill="#FFFFFF" text-anchor="middle">
    LA CALLE TIENE SABOR
